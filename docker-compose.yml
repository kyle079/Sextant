services:
  sextant:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
    environment:
      - Database__Path=/app/data/sextant.db
      - ESI__ClientId=${ESI_CLIENT_ID:-}
      - ESI__ClientSecret=${ESI_CLIENT_SECRET:-}
      - ESI__CallbackUrl=${ESI_CALLBACK_URL:-http://localhost:8080/auth/callback}
      - App__AllowedCorpId=${ALLOWED_CORP_ID:-0}
    restart: unless-stopped
